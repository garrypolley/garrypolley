[build]
publish = "public"
command = "hugo --gc --minify"
base = ""

# Match the Hugo version currently serving production (meta generator: Hugo 0.85.0).
[build.environment]
  HUGO_VERSION = "0.85.0"

[[redirects]]
  from = "https://blog.garrypolley.com/"
  to = "https://garrypolley.com/post/"
  status = 301
  force = true

[[redirects]]
  from = "https://recipe.garrypolley.com/"
  to = "https://garrypolley.com/recipe/"
  status = 301
  force = true

[[redirects]]
  from = "https://garrypolley.com/polley-house"
  to = "https://polley-house-pics.netlify.app/about/"
  status = 200
  force = true

[context.deploy-preview]
command = "hugo -b $DEPLOY_PRIME_URL"
